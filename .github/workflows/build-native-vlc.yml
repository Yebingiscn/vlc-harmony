name: Build native VLC for HarmonyOS

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "ohos_vlc/**"
      - "sync_native_libs.sh"
      - ".github/workflows/build-native-vlc.yml"

permissions:
  contents: read

concurrency:
  group: native-vlc-${{ github.ref }}
  cancel-in-progress: true

env:
  OHOS_SDK_HOME: ${{ github.workspace }}/.ohos-sdk
  OHOS_SDK_API: "26"
  OHOS_SDK_ARCHIVE: ohos-sdk-windows_linux-public.tar.gz
  OHOS_SDK_URL: https://repo.huaweicloud.com/harmonyos/os/7.0-Beta1/ohos-sdk-windows_linux-public.tar.gz

jobs:
  build-native:
    name: Build arm64-v8a libraries
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Restore HarmonyOS native SDK
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: .ohos-sdk/26
          key: harmonyos-native-sdk-7.0-beta1-api26-linux-v1

      - name: Download and verify HarmonyOS native SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OHOS_SDK_HOME}/${OHOS_SDK_API}"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "${OHOS_SDK_ARCHIVE}" "${OHOS_SDK_URL}"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "${OHOS_SDK_ARCHIVE}.sha256" "${OHOS_SDK_URL}.sha256"
          sdk_sha256="$(tr -d '[:space:]' < "${OHOS_SDK_ARCHIVE}.sha256")"
          if [[ ! "${sdk_sha256}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "HarmonyOS SDK checksum file does not contain a valid SHA-256 value."
            exit 1
          fi
          printf '%s  %s\n' "${sdk_sha256}" "${OHOS_SDK_ARCHIVE}" | sha256sum --check -

          tar -tzf "${OHOS_SDK_ARCHIVE}" > sdk-archive-entries.txt
          native_zip_entry="$(grep -E '(^|/)linux/[^/]*native[^/]*\.zip$' \
            sdk-archive-entries.txt | head -n 1)"
          if [[ -z "${native_zip_entry}" ]]; then
            echo "HarmonyOS native SDK zip was not found in ${OHOS_SDK_ARCHIVE}."
            exit 1
          fi

          tar -xOzf "${OHOS_SDK_ARCHIVE}" "${native_zip_entry}" > native-sdk.zip
          unzip -q native-sdk.zip -d "${OHOS_SDK_HOME}/${OHOS_SDK_API}"
          test -x "${OHOS_SDK_HOME}/${OHOS_SDK_API}/native/llvm/bin/clang"
          api26_header="${OHOS_SDK_HOME}/${OHOS_SDK_API}/native/sysroot/usr/include/multimedia/player_framework/native_avcodec_base.h"
          grep -q 'typedef enum OH_FrameRetentionMode' "${api26_header}"
          grep -q 'OH_MD_KEY_VIDEO_DECODER_SPEED' "${api26_header}"
          rm -f "${OHOS_SDK_ARCHIVE}" "${OHOS_SDK_ARCHIVE}.sha256" \
            native-sdk.zip sdk-archive-entries.txt

      - name: Preflight pinned native patch sets
        working-directory: ohos_vlc
        shell: bash
        run: |
          set -euo pipefail
          bash ./validate_native_patchset.sh

      - name: Restore compiled native libraries
        id: native-cache
        uses: actions/cache@v5
        with:
          path: ohos_vlc/library/libs/arm64-v8a
          key: native-vlc-arm64-api26-ffmpeg8-v1-${{ hashFiles('ohos_vlc/prebuild.sh', 'ohos_vlc/recipes/**', 'ohos_vlc/patches/**', 'sync_native_libs.sh') }}

      - name: Restore compiled dependency checkpoint
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: ohos_vlc/tpc_c_cplusplus/lycium/usr
          key: native-vlc-deps-arm64-api26-ffmpeg8-v1-${{ github.run_id }}
          restore-keys: |
            native-vlc-deps-arm64-api26-ffmpeg8-v1-

      - name: Build FFmpeg and VLC
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: ohos_vlc
        shell: bash
        run: |
          set -euo pipefail
          sudo env "OHOS_SDK_HOME=${OHOS_SDK_HOME}" bash ./prebuild.sh

      - name: Sync cached native libraries
        if: steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash ./sync_native_libs.sh

      - name: Verify native output
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r runtime_lib; do
            if [[ -n "${runtime_lib}" && ! -s "entry/libs/arm64-v8a/${runtime_lib}" ]]; then
              echo "Missing required runtime library: ${runtime_lib}"
              exit 1
            fi
          done < ohos_vlc/runtime-libs-arm64.txt
          test -s entry/src/main/cpp/third_party/libvlc/arm64-v8a/libvlc.so
          file entry/libs/arm64-v8a/libvlc.so.5

          video_decoder=entry/libs/arm64-v8a/vlc/plugins/codec/libavcodec_plugin.so
          audio_output=entry/libs/arm64-v8a/vlc/plugins/audio_output/libohos_audiotrack_plugin.so
          osd_output=entry/libs/arm64-v8a/vlc/plugins/video_output/libohos_surface_display_plugin.so
          ffmpeg_decoder=entry/libs/arm64-v8a/libavcodec.so.62
          test -s "${video_decoder}"
          test -s "${audio_output}"
          test -s "${osd_output}"
          test -s "${ffmpeg_decoder}"

          if grep -aFq '[OHOS-DBG] frame received:' "${video_decoder}"; then
            echo "Stale VLC decoder detected: per-frame OHOS debug logging is still present"
            exit 1
          fi
          if ! grep -aFq 'Audio low-latency queue configured' "${audio_output}"; then
            echo "Stale VLC audio output detected: low-latency queue marker is absent"
            exit 1
          fi
          if ! grep -aFq 'OHCodec Surface frames use VLC vout timing' "${video_decoder}"; then
            echo "Stale VLC decoder detected: VLC-vout Surface timing marker is absent"
            exit 1
          fi
          if ! grep -aFq 'OHCodec Surface vout is not ready; dropping frame' "${video_decoder}"; then
            echo "Stale VLC decoder detected: Surface vout initialization guard is absent"
            exit 1
          fi
          if ! grep -aFq 'OHCodec transparent OSD Surface attached' "${osd_output}"; then
            echo "Stale VLC video output detected: transparent OSD marker is absent"
            exit 1
          fi
          if ! grep -aFq 'refresh-rate=system-managed' "${ffmpeg_decoder}"; then
            echo "Stale FFmpeg decoder detected: system-refresh marker is absent"
            exit 1
          fi
          if ! grep -aFq '[OHCodecQueue] bounded backlog' "${ffmpeg_decoder}"; then
            echo "Stale FFmpeg decoder detected: bounded output queue marker is absent"
            exit 1
          fi
          if ! grep -aFq '[OHCodecWatchdog] consumer idle=' "${ffmpeg_decoder}"; then
            echo "Stale FFmpeg decoder detected: watchdog marker is absent"
            exit 1
          fi
          if grep -aFq 'Audio queue completely drained in callback' "${audio_output}"; then
            echo "Stale VLC audio output detected: linked-list callback marker is still present"
            exit 1
          fi

      - name: Package native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          archive="artifacts/vlc-harmony-native-arm64-${GITHUB_SHA}.tar.gz"
          tar -czf "${archive}" \
            ohos_vlc/library/libs/arm64-v8a \
            entry/libs/arm64-v8a \
            entry/src/main/cpp/third_party/libvlc/arm64-v8a
          sha256sum "${archive}" > artifacts/SHA256SUMS

      - name: Upload native libraries
        uses: actions/upload-artifact@v7
        with:
          name: vlc-harmony-native-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vlc-harmony-native-build-logs-${{ github.sha }}
          path: |
            ohos_vlc/tpc_c_cplusplus/**/*.log
            ohos_vlc/tpc_c_cplusplus/**/config.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save dependency checkpoint after a failed native build
        if: failure() && steps.native-cache.outputs.cache-hit != 'true' && steps.dependency-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ohos_vlc/tpc_c_cplusplus/lycium/usr
          key: native-vlc-deps-arm64-api26-ffmpeg8-v1-${{ github.run_id }}
